<!-- 오분류표(혼동행렬) 2×2와 민감도·특이도 · ADsP 보드 개념 도해(교재 무관 일반 개념) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="오분류표 2x2: TP FN FP TN 배치와 민감도·특이도 계산식" font-family="Pretendard, system-ui, sans-serif" fill="currentColor">
  <title>오분류표(혼동행렬)와 민감도·특이도</title>

  <!-- 대각선(정분류) 음영 -->
  <rect x="170" y="110" width="130" height="85" fill="#E8A23C" fill-opacity="0.14"/>
  <rect x="300" y="195" width="130" height="85" fill="#E8A23C" fill-opacity="0.14"/>

  <!-- 격자 -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <rect x="170" y="110" width="260" height="170"/>
    <path d="M300 110 V280"/>
    <path d="M170 195 H430"/>
  </g>

  <!-- 셀 내용 -->
  <g text-anchor="middle">
    <text x="235" y="150" font-size="19" font-weight="700">TP</text>
    <text x="235" y="172" font-size="12">진양성</text>
    <text x="365" y="150" font-size="19" font-weight="700">FN</text>
    <text x="365" y="172" font-size="12">위음성</text>
    <text x="235" y="235" font-size="19" font-weight="700">FP</text>
    <text x="235" y="257" font-size="12">위양성</text>
    <text x="365" y="235" font-size="19" font-weight="700">TN</text>
    <text x="365" y="257" font-size="12">진음성</text>
  </g>

  <!-- 머리글 -->
  <text x="300" y="62" text-anchor="middle" font-size="13" font-weight="700">예측값</text>
  <g font-size="12.5" text-anchor="middle">
    <text x="235" y="98">예측 1 (양성)</text>
    <text x="365" y="98">예측 0 (음성)</text>
  </g>
  <text x="70" y="195" text-anchor="middle" font-size="13" font-weight="700" transform="rotate(-90 70 195)">실제값</text>
  <g font-size="12.5" text-anchor="end">
    <text x="160" y="157">실제 1 (양성)</text>
    <text x="160" y="242">실제 0 (음성)</text>
  </g>

  <!-- 민감도 / 특이도 주석 -->
  <g stroke="#E8A23C" stroke-width="1.6" fill="none">
    <path d="M438 114 H448 V191 H438"/>
    <path d="M438 199 H448 V276 H438"/>
  </g>
  <g font-size="12.5" fill="#E8A23C">
    <text x="458" y="142" font-weight="700">민감도(재현율)</text>
    <text x="458" y="162">= TP / (TP + FN)</text>
    <text x="458" y="227" font-weight="700">특이도</text>
    <text x="458" y="247">= TN / (FP + TN)</text>
  </g>

  <!-- 하단 주석 -->
  <text x="300" y="316" text-anchor="middle" font-size="13">정분류율(Accuracy) = (TP + TN) / 전체</text>
  <text x="300" y="338" text-anchor="middle" font-size="12" opacity="0.8">음영 친 대각선(TP·TN)이 맞힌 칸, 나머지 두 칸이 오분류</text>
</svg>
