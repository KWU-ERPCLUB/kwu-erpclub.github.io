<!-- 상자그림(Box Plot)의 구성요소 · ADsP 보드 개념 도해(교재 무관 일반 개념) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="상자그림: 사분위수 상자, IQR, 수염, 이상치" font-family="Pretendard, system-ui, sans-serif" fill="currentColor">
  <title>상자그림의 구성요소</title>

  <!-- IQR 표기 -->
  <g stroke="currentColor" fill="none" stroke-width="1.3">
    <path d="M200 104 V88 H330 V104"/>
  </g>
  <text x="265" y="78" text-anchor="middle" font-size="13">IQR = Q3 − Q1</text>

  <!-- 수염 -->
  <g stroke="currentColor" fill="none" stroke-width="1.6">
    <path d="M120 145 H200"/>
    <path d="M330 145 H420"/>
    <path d="M120 124 V166"/>
    <path d="M420 124 V166"/>
  </g>

  <!-- 상자 -->
  <rect x="200" y="110" width="130" height="70" fill="#E8A23C" fill-opacity="0.14" stroke="currentColor" stroke-width="1.8"/>
  <path d="M255 110 V180" stroke="#E8A23C" stroke-width="3"/>

  <!-- 이상치 -->
  <g fill="#E8A23C" stroke="currentColor" stroke-width="1">
    <circle cx="468" cy="145" r="4.5"/>
    <circle cx="505" cy="145" r="4.5"/>
  </g>
  <text x="487" y="118" text-anchor="middle" font-size="12.5">이상치(outlier)</text>

  <!-- 상자 라벨 -->
  <g stroke="currentColor" stroke-width="1" opacity="0.5" fill="none">
    <path d="M200 180 V194"/>
    <path d="M255 180 V194"/>
    <path d="M330 180 V194"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="200" y="210">Q1</text>
    <text x="255" y="210">중앙값</text>
    <text x="330" y="210">Q3</text>
    <text x="200" y="226" font-size="11.5" opacity="0.7">25%</text>
    <text x="255" y="226" font-size="11.5" opacity="0.7">50%</text>
    <text x="330" y="226" font-size="11.5" opacity="0.7">75%</text>
  </g>

  <!-- 수염 라벨 -->
  <g stroke="currentColor" stroke-width="1" opacity="0.5" stroke-dasharray="4 4" fill="none">
    <path d="M120 166 V232"/>
    <path d="M420 166 V232"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="120" y="248">Q1 − 1.5 × IQR</text>
    <text x="420" y="248">Q3 + 1.5 × IQR</text>
  </g>

  <!-- 값 축 -->
  <g stroke="currentColor" fill="none" stroke-width="1.3">
    <path d="M60 282 H524"/>
    <path d="M516 277 L524 282 L516 287"/>
  </g>
  <text x="524" y="302" text-anchor="end" font-size="12.5">값이 커지는 방향 →</text>
  <text x="60" y="302" font-size="12" opacity="0.75">수염 밖의 점이 이상치</text>
</svg>
