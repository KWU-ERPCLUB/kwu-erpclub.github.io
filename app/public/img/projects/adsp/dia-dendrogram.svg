<!-- 계층적 군집분석 덴드로그램과 절단선 · ADsP 보드 개념 도해(교재 무관 일반 개념) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="덴드로그램: 6개 관측치의 병합 트리와 높이 h 절단선" font-family="Pretendard, system-ui, sans-serif" fill="currentColor">
  <title>덴드로그램과 절단선</title>

  <!-- 높이 축 -->
  <g stroke="currentColor" fill="none" stroke-width="1.3">
    <path d="M48 300 V60"/>
    <path d="M43 68 L48 60 L53 68"/>
    <path d="M48 300 H60"/>
  </g>
  <text x="66" y="304" font-size="11.5" opacity="0.7">0</text>
  <text x="22" y="180" text-anchor="middle" font-size="13" transform="rotate(-90 22 180)">거리(높이)</text>

  <!-- 트리 -->
  <g stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="square">
    <!-- A + B -> 260 -->
    <path d="M80 300 V260 H140 V300"/>
    <!-- (AB) + C -> 215 -->
    <path d="M110 260 V215 H200 V300"/>
    <!-- D + E -> 250 -->
    <path d="M280 300 V250 H340 V300"/>
    <!-- (DE) + F -> 170 -->
    <path d="M310 250 V170 H430 V300"/>
    <!-- (ABC) + (DEF) -> 100 -->
    <path d="M155 215 V100 H370 V170"/>
  </g>

  <!-- 절단선 -->
  <path d="M50 190 H524" stroke="#E8A23C" stroke-width="2" stroke-dasharray="8 5" fill="none"/>
  <text x="524" y="182" text-anchor="end" font-size="12.5" fill="#E8A23C">절단선 (높이 h)</text>

  <!-- 절단 지점 -->
  <g fill="#E8A23C">
    <circle cx="155" cy="190" r="4"/>
    <circle cx="310" cy="190" r="4"/>
    <circle cx="430" cy="190" r="4"/>
  </g>

  <!-- 관측치 라벨 -->
  <g font-size="12.5" text-anchor="middle">
    <text x="80" y="318">A</text>
    <text x="140" y="318">B</text>
    <text x="200" y="318">C</text>
    <text x="280" y="318">D</text>
    <text x="340" y="318">E</text>
    <text x="430" y="318">F</text>
  </g>

  <!-- 군집 표기 -->
  <g stroke="#E8A23C" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M72 328 V336 H208 V328"/>
    <path d="M272 328 V336 H348 V328"/>
    <path d="M422 328 V336 H438 V328"/>
  </g>
  <g font-size="12" text-anchor="middle" opacity="0.9">
    <text x="140" y="352">군집 1</text>
    <text x="310" y="352">군집 2</text>
    <text x="430" y="352">군집 3</text>
  </g>

  <text x="524" y="72" text-anchor="end" font-size="12.5" opacity="0.9">높이 h에서 자르면 → 군집 3개</text>
  <text x="524" y="90" text-anchor="end" font-size="12" opacity="0.7">절단선이 가로지른 세로선 수 = 군집 수</text>
</svg>
