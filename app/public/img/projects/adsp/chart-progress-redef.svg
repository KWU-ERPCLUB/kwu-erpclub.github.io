<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="진행도 재정의 — 문항 커버리지 54/316=17.1%에서 완료 일차/25 기준으로 교체">
  <style>
    text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .h { font-size: 14px; font-weight: 700; fill: #55524e; letter-spacing: 0.04em; }
    .f { font-size: 26px; font-weight: 800; fill: #161616; }
    .n { font-size: 13px; fill: #55524e; }
    .v { font-size: 15px; font-weight: 700; fill: #161616; }
    .x { font-size: 13px; font-weight: 700; fill: #161616; } /* 버건디는 완료 셀(차트 강조 1요소)에만 */
  </style>
  <!-- 왼쪽: 개편 전 — 문항 커버리지 -->
  <g>
    <text class="h" x="40" y="36">개편 전 — 문항 커버리지</text>
    <text class="f" x="40" y="78">54 ÷ 316 = 17.1%</text>
    <rect x="40" y="100" width="400" height="18" fill="none" stroke="#d9d5cf" stroke-width="1"/>
    <rect x="40" y="100" width="68" height="18" fill="#161616"/>
    <text class="n" x="40" y="146">계획대로 2일차를 마쳐도 17% —</text>
    <text class="n" x="40" y="166">산술은 맞지만 "오늘 몫을 했는가"에 답하지 못함</text>
    <text class="x" x="40" y="196">버그가 아니라 지표 정의가 체감과 어긋난 것</text>
  </g>
  <!-- 화살표 -->
  <g stroke="#161616" stroke-width="2" fill="none">
    <line x1="472" y1="110" x2="516" y2="110"/>
    <path d="M509 103 L516 110 L509 117" fill="none"/>
  </g>
  <!-- 오른쪽: 개편 후 — 완료 일차/25 -->
  <g>
    <text class="h" x="548" y="36">개편 후 — 완료 일차 기준</text>
    <text class="f" x="548" y="78">완료 일차 ÷ 25</text>
    <!-- 25일 셀: 2일 완료 상태 예시 -->
    <g>
      <rect x="548" y="96"  width="26" height="26" fill="#7A2030"/>
      <rect x="580" y="96"  width="26" height="26" fill="#7A2030"/>
      <rect x="612" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="644" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="676" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="708" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="740" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="772" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="804" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="836" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="868" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="900" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="932" y="96"  width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="548" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="580" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="612" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="644" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="676" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="708" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="740" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="772" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="804" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="836" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="868" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
      <rect x="900" y="128" width="26" height="26" fill="none" stroke="#d9d5cf"/>
    </g>
    <text class="v" x="548" y="184">2일차 완료 = 2/25 — 오늘 몫 기준으로 읽힘</text>
    <text class="n" x="548" y="210">일차 완료 판정: 절 학습(그 일차 절 전부) /</text>
    <text class="n" x="548" y="230">모의·기출(세트 전부 응시) / 점검·복습(수동 체크)</text>
  </g>
  <text class="n" x="40" y="300">신고 "2일차인데 17%?" → 산술 확인(54/316=17.1%) → 지표를 문항 비율에서 완료 일차/25로 전면 교체 (07-07)</text>
</svg>
