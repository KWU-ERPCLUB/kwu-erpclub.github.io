<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="주간 AI 트렌드 — 매주 월요일 발행하는 시리즈">
  <title>주간 AI 트렌드</title>
  <!-- 시리즈 고정 커버 v2(2026-08-05 오너 재판정 — v1 "좌 타이포 + 우 점열" 폐기).
       구도 = 매거진 마스트헤드(신문 제호): [킥커 바] → [눈썹] → 헤어라인 → **중앙 대형 제호** → 굵은 룰 페어 → 부제
              → 하단 차콜 발행 밴드. 카드 축소(≈30%)에서도 제호가 먼저 읽히도록 중앙 1축·대비 최대.
       §1 토큰만: 흰 면 ≈78% / 차콜 앵커 1개(하단 밴드) ≈18% / 버건디 <4%(킥커 바=③ 언더바형 · 눈썹 텍스트 · 다크 위 파생 #D18F9A).
       버건디 면(fill) 금지 준수 — 킥커 바는 화이트리스트 ③(스탯 언더바) 형태. 수치·차트 없음. 1200×750(16:10). -->
  <defs>
    <style>
      .t { font-family: Paperlogy, Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    </style>
  </defs>

  <!-- 지면 -->
  <rect width="1200" height="750" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="748" fill="none" stroke="#E7E7E5" stroke-width="2"/>

  <!-- 킥커 바(화이트리스트 ③ 언더바 형태) + 눈썹 -->
  <rect x="550" y="112" width="100" height="7" fill="#7A2030"/>
  <text class="t" x="600" y="188" fill="#7A2030" font-size="31" font-weight="700" letter-spacing="13" text-anchor="middle">WEEKLY AI TREND</text>

  <!-- 제호 위 헤어라인 -->
  <line x1="92" y1="240" x2="1108" y2="240" stroke="#E7E7E5" stroke-width="1.5"/>

  <!-- 제호(nameplate) — 화면에서 가장 큰 단일 요소 -->
  <text class="t" x="600" y="412" fill="#141414" font-size="146" font-weight="800" letter-spacing="-5" text-anchor="middle">주간 AI 트렌드</text>

  <!-- 제호 아래 룰 페어(신문 제호 문법: 굵은 선 + 헤어라인) -->
  <line x1="92" y1="470" x2="1108" y2="470" stroke="#141414" stroke-width="4"/>
  <line x1="92" y1="484" x2="1108" y2="484" stroke="#E7E7E5" stroke-width="1.5"/>

  <!-- 부제 -->
  <text class="t" x="600" y="556" fill="#55606C" font-size="35" font-weight="500" text-anchor="middle">매주 월요일 · 지난 한 주 AI 소식 요약</text>

  <!-- 발행 밴드(다크 앵커 1개) -->
  <rect x="0" y="618" width="1200" height="132" fill="#161616"/>
  <text class="t" x="92" y="695" fill="#FFFFFF" fill-opacity="0.66" font-size="27" font-weight="600" letter-spacing="2">KWU ERP연구회 · AI 인사이트</text>
  <text class="t" x="1108" y="695" fill="#D18F9A" font-size="27" font-weight="700" letter-spacing="9" text-anchor="end">MON</text>
</svg>
