<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="Pretendard, sans-serif" role="img" aria-label="측정 2종 분기 — 절감형과 신규 루틴형">
  <defs>
    <marker id="arw3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#141414"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="560" fill="#ffffff"/>

  <!-- 분기 질문 -->
  <rect x="400" y="60" width="600" height="96" rx="18" fill="#fafaf9" stroke="#e7e7e5" stroke-width="2"/>
  <text x="700" y="118" text-anchor="middle" font-size="28" font-weight="800" fill="#141414">이 작업, 스터디 전에도 하고 있었나?</text>

  <!-- 분기선 -->
  <path d="M 620 156 L 380 288" fill="none" stroke="#141414" stroke-width="3" marker-end="url(#arw3)"/>
  <path d="M 780 156 L 1020 288" fill="none" stroke="#141414" stroke-width="3" marker-end="url(#arw3)"/>

  <rect x="448" y="196" width="80" height="44" rx="22" fill="#161616"/>
  <text x="488" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">예</text>
  <rect x="862" y="196" width="112" height="44" rx="22" fill="#161616"/>
  <text x="918" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">아니오</text>

  <!-- 절감형 -->
  <rect x="140" y="300" width="480" height="190" rx="18" fill="#fafaf9" stroke="#e7e7e5" stroke-width="2"/>
  <text x="380" y="360" text-anchor="middle" font-size="30" font-weight="800" fill="#141414">절감형</text>
  <text x="380" y="398" text-anchor="middle" font-size="22" fill="#55606c">원래 하던 일을 더 짧게</text>
  <text x="380" y="446" text-anchor="middle" font-size="24" font-weight="700" fill="#141414">잰다 = <tspan fill="#7a2030">전·후 시간</tspan></text>

  <!-- 신규 루틴형 -->
  <rect x="780" y="300" width="480" height="190" rx="18" fill="#fafaf9" stroke="#e7e7e5" stroke-width="2"/>
  <text x="1020" y="360" text-anchor="middle" font-size="30" font-weight="800" fill="#141414">신규 루틴형</text>
  <text x="1020" y="398" text-anchor="middle" font-size="22" fill="#55606c">원래 안 하던 일을 새로 굴림</text>
  <text x="1020" y="446" text-anchor="middle" font-size="24" font-weight="700" fill="#141414">잰다 = <tspan fill="#7a2030">사용 횟수·지속 주수</tspan></text>
</svg>
