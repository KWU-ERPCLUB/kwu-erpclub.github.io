<svg width="720" height="300" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="삼성SDS 2026년 2분기 부문별 매출 증가율 막대 그래프. 전체 매출 5.9퍼센트, 전통 IT서비스 5퍼센트, 클라우드 17퍼센트, 클라우드 대외 매출 75퍼센트 증가.">
  <style>
    text { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .t { font-size: 15px; font-weight: 700; fill: #141414; }
    .s { font-size: 15px; fill: #55606c; }
    .lb { font-size: 14px; fill: #141414; }
    .v { font-size: 15px; font-weight: 700; fill: #55606c; }
  </style>
  <rect width="720" height="300" fill="#ffffff"/>
  <text class="t" x="16" y="30">성장이 나온 칸은 전통 SI가 아니었다</text>
  <text class="s" x="16" y="50">삼성SDS 2026년 2분기 · 전년 동기 대비 매출 증가율 · 단위 = %</text>

  <line x1="228" y1="70" x2="228" y2="232" stroke="#e7e7e5" stroke-width="1"/>

  <!-- 전체 5.9 -->
  <text class="lb" x="216" y="93" text-anchor="end">전체 매출</text>
  <path d="M228,76 h36 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-36 z" fill="#c9b7bb"/>
  <text class="v" x="278" y="93">+5.9</text>

  <!-- IT서비스 5 -->
  <text class="lb" x="216" y="133" text-anchor="end">IT서비스(전통 SI)</text>
  <path d="M228,116 h30 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-30 z" fill="#c9b7bb"/>
  <text class="v" x="272" y="133">+5</text>

  <!-- 클라우드 17 -->
  <text class="lb" x="216" y="173" text-anchor="end">클라우드</text>
  <path d="M228,156 h103 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-103 z" fill="#a94b5c"/>
  <text class="v" x="345" y="173" style="fill:#a94b5c">+17</text>

  <!-- 클라우드 대외 75 -->
  <text class="lb" x="216" y="213" text-anchor="end">클라우드 대외 매출</text>
  <path d="M228,196 h454 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-454 z" fill="#a94b5c"/>
  <text class="v" x="596" y="213" style="fill:#ffffff">+75</text>

  <line x1="16" y1="248" x2="704" y2="248" stroke="#e7e7e5" stroke-width="1"/>
  <text class="s" x="16" y="268">LG CNS도 같은 방향 — 상반기 AI·클라우드 1조6,714억원으로 매출의 약 59%.</text>

  <text class="s" x="16" y="292">출처: 삼성SDS·LG CNS 2026년 2분기 실적발표 · ZDNet Korea</text>
</svg>
