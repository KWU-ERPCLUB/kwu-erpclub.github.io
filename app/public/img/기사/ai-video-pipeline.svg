<svg width="720" height="330" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 영상 상업 제작 파이프라인 8단계 흐름도. 기획·스크립트는 Claude·ChatGPT·Gemini, 스타일프레임은 Midjourney·GPT Image 2·FLUX.2, 업스케일·디테일은 Magnific·Topaz, 영상 생성은 Seedance·Kling·Higgsfield·Veo 3.1, 연기·립싱크는 Runway Act-Two·OmniHuman·HeyGen, 편집·합성은 Premiere·After Effects·DaVinci Resolve, 음성·더빙은 ElevenLabs, 음악·효과음은 Suno·Udio.">
