<svg width="720" height="300" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="해외 AI 영화제 상금 규모 비교 막대 그래프. 구글 Global AI Film Award 그랑프리 100만 달러, Chroma Awards 시즌2 총상금 25만 달러 이상, Runway AIF 2026 총상금 13만5천 달러 이상, Runway AIF 필름 1위 5만 달러.">
  <style>
    text { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .t { font-size: 15px; font-weight: 700; fill: #141414; }
    .s { font-size: 12px; fill: #55606c; }
    .lb { font-size: 12.5px; fill: #141414; }
    .v { font-size: 12px; font-weight: 700; fill: #55606c; }
  </style>
  <rect width="720" height="300" fill="#ffffff"/>
  <text class="t" x="16" y="30">AI 영화제 상금 규모 — 올라간 판돈</text>
  <text class="s" x="16" y="50">공개된 상금 · 단위 = 만 달러</text>

  <line x1="252" y1="70" x2="252" y2="232" stroke="#e7e7e5" stroke-width="1"/>

  <!-- Google 그랑프리 100만 달러 = 100만 단위 -->
  <text class="lb" x="240" y="93" text-anchor="end">Google 첫 대회 그랑프리</text>
  <path d="M252,76 h420 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-420 z" fill="#a94b5c"/>
  <text class="v" x="560" y="93" style="fill:#ffffff">100만 달러</text>

  <!-- Chroma 시즌2 총상금 25만+ -->
  <text class="lb" x="240" y="133" text-anchor="end">Chroma Awards 시즌2 총상금</text>
  <path d="M252,116 h105 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-105 z" fill="#c9b7bb"/>
  <text class="v" x="371" y="133">25만+ 달러</text>

  <!-- Runway AIF 총상금 13.5만+ -->
  <text class="lb" x="240" y="173" text-anchor="end">Runway AIF 2026 총상금</text>
  <path d="M252,156 h57 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-57 z" fill="#c9b7bb"/>
  <text class="v" x="323" y="173">13.5만+ 달러</text>

  <!-- Runway 필름 1위 5만 -->
  <text class="lb" x="240" y="213" text-anchor="end">Runway AIF 필름 1위</text>
  <path d="M252,196 h21 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-21 z" fill="#c9b7bb"/>
  <text class="v" x="287" y="213">5만 달러</text>

  <line x1="252" y1="248" x2="704" y2="248" stroke="#e7e7e5" stroke-width="1"/>
  <text class="s" x="252" y="268">국내는 별도 판 — 대전 4,800만원 · ACC 2,100만원 · 마사회 1,400만원.</text>

  <text class="s" x="16" y="292">출처: Google 블로그 · Runway AIF 공식 · Chroma Awards 공식</text>
</svg>
