name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 운영진 GitHub 계정 목록(JSON 배열) — 이들만 공용 영역을 직접 변경할 수 있다(SPEC §6).
  # 오너 교체·운영진 추가 = 이 한 줄만 수정(예: '["bapzzi","newowner"]').
  MAINTAINERS: '["bapzzi"]'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard-shared-paths
        if: "${{ !contains(fromJSON(env.MAINTAINERS), github.actor) }}"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git fetch origin "$BASE" --depth=1 || true
          CHANGED=$(git diff --name-only "$BASE" ${{ github.sha }} 2>/dev/null || git show --name-only --format= ${{ github.sha }})
          VIOLATION=$(echo "$CHANGED" | grep -vE '^app/content/' || true)
          if [ -n "$VIOLATION" ]; then
            echo "공용 영역 변경은 PR + 오너 승인이 필요합니다 (SPEC §6):"
            echo "$VIOLATION"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run validate
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
