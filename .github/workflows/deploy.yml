name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 안전망(2026-08-07): 야간 루틴 push의 Actions 이벤트가 유실된 사고(1241fbb — 런 0건 → DB 동기화 누락으로
  # 신규 기사가 사이트에 미표시) 재발 대비. 매일 06:30 KST(= 야간 루틴 05시 이후) 전체 재실행으로 자가 복구.
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 운영진 GitHub 계정 목록(JSON 배열) — 이들만 공용 영역을 직접 변경할 수 있다(SPEC §6).
  # 오너 교체·운영진 추가 = 이 한 줄만 수정(예: '["bapzzi","newowner"]').
  MAINTAINERS: '["bapzzi"]'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard-shared-paths
        # schedule·dispatch 이벤트에는 diff 기준 커밋이 없어 스킵(push·PR에서만 판정)
        if: "${{ (github.event_name == 'push' || github.event_name == 'pull_request') && !contains(fromJSON(env.MAINTAINERS), github.actor) }}"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git fetch origin "$BASE" --depth=1 || true
          CHANGED=$(git diff --name-only "$BASE" ${{ github.sha }} 2>/dev/null || git show --name-only --format= ${{ github.sha }})
          VIOLATION=$(echo "$CHANGED" | grep -vE '^app/content/' || true)
          if [ -n "$VIOLATION" ]; then
            echo "공용 영역 변경은 PR + 오너 승인이 필요합니다 (SPEC §6):"
            echo "$VIOLATION"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run validate
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
        # 워크스페이스 백엔드 주입(SPEC §1) — 미설정이면 빈 값 → /workspace/ 는 "백엔드 연결 대기" 화면.
        # 등록 = repo Settings > Secrets and variables > Actions. anon key만 등록(service 키 금지·판정 P2).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  # md → DB 동기화(SPEC §0-6): 루틴·PR로 들어온 기사 md를 articles 테이블에 upsert.
  # deploy를 막지 않는다(deploy는 build만 needs) — 다만 실패하면 이 잡이 빨갛게 남아 Actions에서 보인다.
  # 삭제 연산 없음(스크립트가 upsert만 한다). service 키는 secret에서만 온다(P2).
  sync-content:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: sync md -> DB
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::SUPABASE secrets 미등록 — md→DB 동기화 건너뜀(사이트 배포는 정상)"
            exit 0
          fi
          node scripts/sync-content-db.mjs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
